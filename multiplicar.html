<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla del 3</title>
    <link rel="stylesheet" href="multiplicar.css">
    <script src="multiplicar.js"></script>
</head>
<body>

    <div class="contenedor" id="contenedor">

    <h1 class="titulo">📘 Generador de Tablas de Multiplicar</h1>

    <p class="descripcion">
        Escribe un número y presiona el botón para generar su tabla de multiplicar del 1 al 10.
    </p>

    <div class="entrada">

        <label for="txtNumero" class="etiqueta">
            Número a multiplicar
        </label>

        <input
            type="number"
            id="txtNumero"
            placeholder="Ejemplo: 8">

        <small class="ayuda">
            Ingresa cualquier número entero. Ejemplo: 3, 5, 8 o 12.
        </small>

    </div>

    <button class="btn" onclick="generarTablas()">
        Generar tabla
    </button>

    <div id="tabla" class="tabla"></div>

</div>

</body>
</html>
